# Creality K1C (0.4 mm nozzle, Klipper) + PLA 1.75 mm, for PrusaSlicer's CLI.
# Matches the CUHK Library MakerSpace printer: 220 x 220 x 250 mm, layers 0.1-0.35 mm,
# MakerSpace PLA only. Values follow Creality Print's K1C 0.20 mm standard profile,
# with slower outer walls and top surfaces for a cleaner finish.

# printer
printer_model = K1C
printer_notes = CUHK MakerSpace Creality K1C
gcode_flavor = klipper
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.32
use_relative_e_distances = 1
use_firmware_retraction = 0
retract_length = 0.8
retract_speed = 40
deretract_speed = 40
retract_lift = 0.4
retract_lift_below = 249
retract_before_travel = 1
retract_layer_change = 1
wipe = 1
machine_limits_usage = time_estimate_only
machine_max_acceleration_extruding = 20000
machine_max_acceleration_retracting = 5000
machine_max_acceleration_travel = 20000
machine_max_acceleration_x = 20000
machine_max_acceleration_y = 20000
machine_max_acceleration_z = 500
machine_max_acceleration_e = 5000
machine_max_feedrate_x = 500
machine_max_feedrate_y = 500
machine_max_feedrate_z = 30
machine_max_feedrate_e = 100
machine_max_jerk_x = 12
machine_max_jerk_y = 12
machine_max_jerk_z = 2
machine_max_jerk_e = 2.5
autoemit_temperature_commands = 0
start_gcode = M140 S0\nM104 S0\nSTART_PRINT EXTRUDER_TEMP={first_layer_temperature[0]} BED_TEMP={first_layer_bed_temperature[0]}\nG90\nM83\n
end_gcode = END_PRINT\n
before_layer_gcode = ;BEFORE_LAYER_CHANGE\n;[layer_z]\n
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]\nSET_PRINT_STATS_INFO CURRENT_LAYER={layer_num + 1}\n
binary_gcode = 0
thumbnails =

# filament
filament_type = PLA
filament_diameter = 1.75
filament_density = 1.24
filament_cost = 0
extrusion_multiplier = 0.98
first_layer_temperature = 220
temperature = 220
first_layer_bed_temperature = 60
bed_temperature = 60
filament_max_volumetric_speed = 21
cooling = 1
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 1
full_fan_speed_layer = 3
fan_below_layer_time = 100
slowdown_below_layer_time = 6
min_print_speed = 20

# print
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = grid
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
perimeter_generator = arachne
external_perimeters_first = 0
seam_position = aligned
skirts = 1
skirt_distance = 6
skirt_height = 1
brim_width = 0
support_material = 1
support_material_auto = 1
support_material_style = organic
support_material_threshold = 45
support_material_contact_distance = 0.2
support_material_buildplate_only = 0
ensure_vertical_shell_thickness = ensure_all
avoid_crossing_perimeters = 0
first_layer_speed = 50
perimeter_speed = 250
small_perimeter_speed = 120
external_perimeter_speed = 150
infill_speed = 270
solid_infill_speed = 220
top_solid_infill_speed = 150
support_material_speed = 150
support_material_interface_speed = 80%
bridge_speed = 50
gap_fill_speed = 120
travel_speed = 500
travel_speed_z = 12
default_acceleration = 10000
perimeter_acceleration = 7000
external_perimeter_acceleration = 4000
top_solid_infill_acceleration = 4000
infill_acceleration = 10000
bridge_acceleration = 5000
first_layer_acceleration = 1000
travel_acceleration = 12000
gcode_comments = 0
gcode_label_objects = firmware
output_filename_format = {input_filename_base}.gcode
